    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              neon: {
                purple: '#bc13fe',
                blue: '#0099ff',
                pink: '#ff00ff',
              },
              primary: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
                DEFAULT: '#0099ff',
              }
            },
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },
            boxShadow: {
              'neon-blue': '0 0 15px rgba(0, 153, 255, 0.5)',
              'neon-purple': '0 0 15px rgba(188, 19, 254, 0.5)',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Outfit', sans-serif;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }

      .animate-enter {
        animation: enter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: translateY(10px);
      }
      @keyframes enter { to { opacity: 1; transform: translateY(0); } }
      
      .loader-spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .neon-border-blue {
        box-shadow: 0 0 5px #0099ff, 0 0 10px #0099ff;
      }
      .neon-border-purple {
        box-shadow: 0 0 5px #bc13fe, 0 0 10px #bc13fe;
      }
      .neon-text-blue {
        text-shadow: 0 0 5px #0099ff, 0 0 10px #0099ff;
      }
      .neon-text-purple {
        text-shadow: 0 0 5px #bc13fe, 0 0 10px #bc13fe;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@0.454.0",
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
  <script src="/config.js"></script>
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
    <!-- Explicit module entry point -->
    <script type="module" src="./index.tsx"></script>
    <script>
      // Theme check
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
      
      // Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Error:', err));
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
